
<div class="app-shell">
  <app-cabecalho></app-cabecalho>

  <div class="layout-principal">
    <aside class="sidebar">
      <app-menu
        (abaSelecionada)="mudarAba($event)">
      </app-menu>
    </aside>

    <main class="main-content">
      <div class="page">

       
        <section *ngIf="aba === 'inicio'">
          <h2>Bem-vindo à Essenza</h2>
          <p>Estética, bem-estar e gestão em um só lugar.</p>
        </section>

       
        <app-produtos
  *ngIf="aba === 'produtos'"
  (adicionarCarrinho)="adicionarItemCarrinho($event)">
</app-produtos>

      
        <app-servicos *ngIf="aba === 'servicos'"></app-servicos>

        <section *ngIf="aba === 'carrinho'">

          <h2>Finalizar compra</h2>
        
          <label for="clienteCompra">Selecione o cliente:</label>
        
          <select
            id="clienteCompra"
            name="clienteCompra"
            [(ngModel)]="clienteSelecionado">
        
            <option [ngValue]="null">Selecione um cliente</option>
        
            <option
              *ngFor="let pessoa of pessoas"
              [ngValue]="pessoa.idPessoa">
              {{ pessoa.nome }}
            </option>
        
          </select>
        
          <app-carrinho
            [itens]="itensCarrinho"
            (alterarQuantidade)="atualizarQuantidadeCarrinho($event)"
            (removerItem)="removerItemCarrinho($event)">
          </app-carrinho>
        
          <button
            type="button"
            (click)="finalizarCompra()"
            [disabled]="itensCarrinho.length === 0">
            Finalizar compra
          </button>
        
        </section>



        
        <app-clientes
          *ngIf="aba === 'clientes'">
        </app-clientes>

      </div>
    </main>
  </div>
</div>
